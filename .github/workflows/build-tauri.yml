# Compila el Events Client de Tauri (rama `tauri` de events-client) en Windows, macOS (Apple
# Silicon e Intel) y Linux. De momento SOLO PRUEBA: no publica nada. Publicar llegará cuando se
# decida cómo convive con el de Electron (mismas versiones, mismas releases) y con la firma del
# actualizador (secretos TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
#
# Mismas reglas que build.yml, porque este repo es público:
#   · nada imprime código, rutas ni dependencias: la salida de npm, esbuild y cargo va a un
#     archivo del runner que nunca se sube;
#   · si falla, ese registro sale CIFRADO (AES con una clave al azar, envuelta con la clave
#     pública de abajo; la privada solo la tiene quien mantiene esto): se puede depurar sin
#     enseñar nada;
#   · ni artifacts ni cachés; solo workflow_dispatch; borra sus ejecuciones anteriores.
#
# Secreto: SOURCE_TOKEN (Contents: read de EventsTeamMC/events-client).
name: Events Client (Tauri)
run-name: ${{ inputs.entregar && 'Instaladores de prueba' || 'Compilación de prueba' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit de events-client'
        required: true
        default: 'tauri'
      entregar:
        description: 'Subir los instaladores de prueba a un borrador privado (tauri-prueba)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: events-client-tauri
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LOG_PUBKEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtTCVeHG5pD8wgpFmXwuI
    wn+M3wYU9p2YFlPtYAtR+BkI4jBsQfat9dEFseoYXfxXpY2TbVNQNaKJFhrMP0Jg
    X5xZ2dt98mZHNIPeqMxA9edgLoTN4uy/y4UwriqlZQlypiNe3dVlvBXxPeRfMvDZ
    WvnEOI+NFBHs3Jsl+vUB28x76DegeQgZCcd7Ptyv4PMH69n8se0Y2ADVafLK3lo/
    zg3e5XEL5LCxXPykdBzrQoePPbfVxskQIgSL658HJWtYEOYZb1UGntpJFpGA+Wps
    ONDootHQnp6sdvxO9iKw615lzYYGHbVkJ9zePErcbSbm6+V4oOwzcoLc1I9WjsU6
    CB8Mxz3D5saiSqP4fFUPor2/yyIRUzwITB2QA99z9XTBm0jXetE2vOMxYnY+6nTl
    J1cBNMbJnXdcgbdruaFXlGvsmrTj8uvQKVemDUf0YJGcJC3IQt4622qvsklosETq
    3T+vW7WTUPpiM7uc6Kac9LzDqmy4QkjLs0YnaHl1tQYpAgMBAAE=
    -----END PUBLIC KEY-----

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
    steps:
      - name: Ejecuciones anteriores fuera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow build-tauri.yml --status completed --limit 100 --json databaseId -q '.[].databaseId' \
            | while read -r id; do gh run delete "$id" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; done

      - name: Código
        id: src
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref no válido"; exit 1; }
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$REF"
          echo "sha=$(git -C src rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          # Tauri lleva su versión (tauri.conf.json); las de aquí, -dev.N en orden (la 9.ª ejecución fue la dev.1).
          BASE=$(git -C src show FETCH_HEAD:tauri/src-tauri/tauri.conf.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          echo "version=${BASE}-dev.$(( GITHUB_RUN_NUMBER - 8 ))" >> "$GITHUB_OUTPUT"

      # Un borrador no lo ve nadie fuera del repo, ni el actualizador ni la web de descargas.
      - name: Borrador de prueba
        if: ${{ inputs.entregar }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          # Un borrador por versión: quedan en orden (v2.0.0-beta.1-dev.1t, dev.2t…).
          gh release create "v${VERSION}t" -R "$GITHUB_REPOSITORY" --draft --title "Events Client v${VERSION}t (Tauri)" \
            --notes "v${VERSION}t · compilación de prueba, sin firmar. Datos propios: no toca el Events Client instalado." > /dev/null

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'nsis,msi', name: Windows }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg', name: macOS Apple Silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: 'app,dmg', name: macOS Intel }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb,rpm', name: Linux }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Código
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Sistema
        timeout-minutes: 15
        run: |
          LOG="$RUNNER_TEMP/build.log"
          {
            rustup target add ${{ matrix.target }}
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf rpm gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            fi
          } >> "$LOG" 2>&1 || { echo "::error::No se pudo preparar el sistema"; exit 1; }

      - name: Compilar
        working-directory: src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          # La de prueba se llama distinto y guarda aparte (env.rs PRUEBA): convive con el instalado.
          EC_PRUEBA: ${{ inputs.entregar && '1' || '' }}
          EC_VERSION: ${{ needs.prepare.outputs.version }}
          # La de prueba lleva el inspector web (clic derecho → Inspeccionar) para ver errores.
          FEAT: ${{ inputs.entregar && '--features devtools' || '' }}
          CFG: ${{ inputs.entregar && '{"productName":"Events Client (Tauri)","mainBinaryName":"Events Client Tauri","identifier":"xyz.eventsmc.client.prueba","build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' || '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          # WiX (MSI) solo admite versiones numéricas: 2.0.0-beta.1-dev.7 → 2.0.0.7.
          MSI_VERSION="$(echo "$EC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+').$(echo "$EC_VERSION" | grep -oE '[0-9]+$')"
          # Cadena con && (set -e no actúa dentro de un `||`) y en un subshell (el cd no se queda).
          ( npm ci --no-audit --no-fund --ignore-scripts \
            && (cd tauri/ui && npm ci --no-audit --no-fund && node build.mjs) \
            && cd tauri/src-tauri \
            && npx --yes @tauri-apps/cli@2.9.4 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
                 --config "$CFG" --config "{\"version\":\"$EC_VERSION\",\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$MSI_VERSION\"}}}}" $FEAT \
          ) >> "$LOG" 2>&1 || { echo "::error::La compilación ha fallado (registro cifrado abajo)"; exit 1; }
          # Portable de Windows: el .exe tal cual, sin instalar (necesita WebView2, que trae Windows 10/11).
          if [ "$RUNNER_OS" = Windows ]; then
            exe="$(ls "tauri/target/${{ matrix.target }}/release/"*.exe | grep -vi 'setup\|uninstall' | head -1)"
            7z a -tzip "tauri/target/${{ matrix.target }}/release/bundle/Events.Client_${EC_VERSION}_x64-portable.zip" "$exe" > /dev/null
          fi
          echo "Paquetes:"
          find "tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            | while read -r f; do echo "  $(basename "$f")  $(( $(wc -c < "$f") / 1048576 )) MB"; done

      - name: Subir al borrador
        if: ${{ inputs.entregar }}
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find "tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0             | xargs -0 gh release upload "v${{ needs.prepare.outputs.version }}t" -R "$GITHUB_REPOSITORY" --clobber > /dev/null

      - name: Registro cifrado
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          printf '%s\n' "$LOG_PUBKEY" | sed 's/^ *//' > "$RUNNER_TEMP/pub.pem"
          tail -c 400000 "$LOG" > "$RUNNER_TEMP/tail.log"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          echo "===== CLAVE ====="
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" | base64 | tr -d '\n'; echo
          echo "===== REGISTRO ====="
          gzip -9c "$RUNNER_TEMP/tail.log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/k" | base64 | tr -d '\n'; echo
          echo "===== FIN ====="
          rm -f "$RUNNER_TEMP/k"
