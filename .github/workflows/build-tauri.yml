# Compila el Events Client de Tauri (rama `tauri` de events-client) en Windows, macOS (Apple
# Silicon e Intel) y Linux. De momento SOLO PRUEBA: no publica nada. Publicar llegará cuando se
# decida cómo convive con el de Electron (mismas versiones, mismas releases) y con la firma del
# actualizador (secretos TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
#
# Mismas reglas que build.yml, porque este repo es público:
#   · nada imprime código, rutas ni dependencias: la salida de npm, esbuild y cargo va a un
#     archivo del runner que nunca se sube;
#   · si falla, ese registro sale CIFRADO (AES con una clave al azar, envuelta con la clave
#     pública de abajo; la privada solo la tiene quien mantiene esto): se puede depurar sin
#     enseñar nada;
#   · ni artifacts ni cachés; solo workflow_dispatch; borra sus ejecuciones anteriores.
#
# Secreto: SOURCE_TOKEN (Contents: read de EventsTeamMC/events-client).
name: Events Client (Tauri)
run-name: ${{ inputs.publicar && 'Versión pública (borrador)' || inputs.entregar && 'Instaladores de prueba' || 'Compilación de prueba' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit de events-client'
        required: true
        default: 'tauri'
      entregar:
        description: 'Subir los instaladores de prueba a un borrador privado (tauri-prueba)'
        type: boolean
        default: false
      publicar:
        description: 'Versión pública: la de producción, firmada, en un borrador listo para publicar (beta si la versión lleva -beta, estable si no; no publica nada solo)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: events-client-tauri
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LOG_PUBKEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtTCVeHG5pD8wgpFmXwuI
    wn+M3wYU9p2YFlPtYAtR+BkI4jBsQfat9dEFseoYXfxXpY2TbVNQNaKJFhrMP0Jg
    X5xZ2dt98mZHNIPeqMxA9edgLoTN4uy/y4UwriqlZQlypiNe3dVlvBXxPeRfMvDZ
    WvnEOI+NFBHs3Jsl+vUB28x76DegeQgZCcd7Ptyv4PMH69n8se0Y2ADVafLK3lo/
    zg3e5XEL5LCxXPykdBzrQoePPbfVxskQIgSL658HJWtYEOYZb1UGntpJFpGA+Wps
    ONDootHQnp6sdvxO9iKw615lzYYGHbVkJ9zePErcbSbm6+V4oOwzcoLc1I9WjsU6
    CB8Mxz3D5saiSqP4fFUPor2/yyIRUzwITB2QA99z9XTBm0jXetE2vOMxYnY+6nTl
    J1cBNMbJnXdcgbdruaFXlGvsmrTj8uvQKVemDUf0YJGcJC3IQt4622qvsklosETq
    3T+vW7WTUPpiM7uc6Kac9LzDqmy4QkjLs0YnaHl1tQYpAgMBAAE=
    -----END PUBLIC KEY-----

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
      pre: ${{ steps.src.outputs.pre }}
    steps:
      - name: Ejecuciones anteriores fuera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow build-tauri.yml --status completed --limit 100 --json databaseId -q '.[].databaseId' \
            | while read -r id; do gh run delete "$id" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; done

      - name: Código
        id: src
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref no válido"; exit 1; }
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$REF"
          echo "sha=$(git -C src rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          # Tauri lleva su versión (tauri.conf.json); las de aquí, -dev.N en orden (la 9.ª ejecución fue la dev.1).
          BASE=$(git -C src show FETCH_HEAD:tauri/src-tauri/tauri.conf.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "${{ inputs.publicar }}" = true ]; then echo "version=${BASE}" >> "$GITHUB_OUTPUT"; else echo "version=${BASE}-dev.$(( GITHUB_RUN_NUMBER - 8 ))" >> "$GITHUB_OUTPUT"; fi
          # 2.0.0-beta.3 → prerelease (canal beta); 2.0.0 → estable.
          case "$BASE" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      # Un borrador no lo ve nadie fuera del repo, ni el actualizador ni la web de descargas.
      # La versión pública también empieza como borrador (prerelease si es beta): se publica a mano cuando toca.
      - name: Borrador de la versión
        if: ${{ inputs.publicar }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.src.outputs.version }}
          PRE: ${{ steps.src.outputs.pre }}
        run: |
          if [ "$PRE" = true ]; then FLAGS=--prerelease; NOTES="Beta de Events Client 2.0."; else FLAGS=; NOTES="Events Client ${VERSION}."; fi
          gh release view "v${VERSION}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "v${VERSION}" -R "$GITHUB_REPOSITORY" --draft $FLAGS --title "Events Client ${VERSION}" \
                 --notes "$NOTES" > /dev/null

      - name: Borrador de prueba
        if: ${{ inputs.entregar && !inputs.publicar }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          # Un borrador por versión: quedan en orden (v2.0.0-beta.1-dev.1t, dev.2t…).
          gh release create "v${VERSION}" -R "$GITHUB_REPOSITORY" --draft --title "Events Client v${VERSION} (Tauri)" \
            --notes "v${VERSION} · compilación de prueba, sin firmar. Datos propios: no toca el Events Client instalado." > /dev/null

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'nsis,msi', name: Windows }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg', name: macOS Apple Silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: 'app,dmg', name: macOS Intel }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb,rpm', name: Linux }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Código
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Sistema
        timeout-minutes: 15
        run: |
          LOG="$RUNNER_TEMP/build.log"
          {
            rustup target add ${{ matrix.target }}
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf rpm gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            fi
          } >> "$LOG" 2>&1 || { echo "::error::No se pudo preparar el sistema"; exit 1; }

      - name: Compilar
        working-directory: src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          # La de prueba se llama distinto y guarda aparte (env.rs PRUEBA): convive con el instalado.
          EC_PRUEBA: ${{ inputs.entregar && !inputs.publicar && '1' || '' }}
          # La beta pública va firmada para el actualizador (minisign; la pública está en tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.publicar && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.publicar && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          EC_VERSION: ${{ needs.prepare.outputs.version }}
          # Ninguna lleva el inspector web: el código no se enseña (los errores van por diagnósticos y F1).
          FEAT: ''
          CFG: ${{ inputs.publicar && '{"build":{"beforeBuildCommand":""}}' || inputs.entregar && '{"productName":"Events Client (Tauri)","mainBinaryName":"Events Client Tauri","identifier":"xyz.eventsmc.client.prueba","build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' || '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          # WiX (MSI) solo admite versiones numéricas: 2.0.0-beta.1-dev.7 → 2.0.0.7.
          MSI_VERSION="$(echo "$EC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+').$(echo "$EC_VERSION" | grep -oE '[0-9]+$')"
          # Cadena con && (set -e no actúa dentro de un `||`) y en un subshell (el cd no se queda).
          ( npm ci --no-audit --no-fund --ignore-scripts \
            && (cd tauri/ui && npm ci --no-audit --no-fund && node build.mjs) \
            && cd tauri/src-tauri \
            && npx --yes @tauri-apps/cli@2.9.4 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
                 --config "$CFG" --config "{\"version\":\"$EC_VERSION\",\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$MSI_VERSION\"}}}}" $FEAT \
          ) >> "$LOG" 2>&1 || { echo "::error::La compilación ha fallado (registro cifrado abajo)"; exit 1; }
          # Portable de Windows: una carpeta «Events Client» con el .exe y, al lado, los recursos que el
          # instalador pone junto a él (social/: la librería de Discord; sin ella no hay Amigos). Sin la
          # ruta de compilación dentro del zip. Necesita WebView2, que trae Windows 10/11.
          if [ "$RUNNER_OS" = Windows ]; then
            exe="$(ls "tauri/target/${{ matrix.target }}/release/"*.exe | grep -vi 'setup\|uninstall' | head -1)"
            zip="$PWD/tauri/target/${{ matrix.target }}/release/bundle/Events.Client_${EC_VERSION}_x64-portable.zip"
            stage="$RUNNER_TEMP/portable/Events Client"
            rm -rf "$RUNNER_TEMP/portable" && mkdir -p "$stage/social"
            cp "$exe" "$stage/"
            cp tauri/src-tauri/social/discord_partner_sdk.dll tauri/src-tauri/social/License-Notices.txt "$stage/social/"
            ( cd "$RUNNER_TEMP/portable" && 7z a -tzip "$zip" "Events Client" > /dev/null )
          fi
          # macOS: el DMG otra vez con create-dmg, para poner los iconos grandes (128 px; el de Tauri los
          # deja pequeños) y el fondo a doble resolución (Retina). Lleva los términos igual que antes.
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(ls -d "tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)"
            dmg="$(ls "tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg | head -1)"
            name="$(basename "$app")"
            bg="$RUNNER_TEMP/dmg-background.tiff"
            ( tiffutil -cathidpicheck tauri/src-tauri/icons/dmg-background.png tauri/src-tauri/icons/dmg-background@2x.png -out "$bg"               && brew install create-dmg               && rm -f "$dmg"               && create-dmg --volname "${name%.app}" --background "$bg" --window-size 660 420 --icon-size 128                    --icon "$name" 180 205 --app-drop-link 480 205 --hide-extension "$name"                    --eula tauri/src-tauri/installer/license.rtf --no-internet-enable "$dmg" "$app"             ) >> "$LOG" 2>&1 || { echo "::error::El DMG no se ha podido rehacer (registro cifrado abajo)"; exit 1; }
          fi
          echo "Paquetes:"
          find "tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            | while read -r f; do echo "  $(basename "$f")  $(( $(wc -c < "$f") / 1048576 )) MB"; done

      - name: Subir al borrador
        if: ${{ inputs.entregar || inputs.publicar }}
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lo que pide el actualizador de Tauri: el paquete y su firma (.sig). En macOS el .app.tar.gz
          # se llama igual en las dos arquitecturas: se le pone la suya.
          if [ "${{ inputs.publicar }}" = true ]; then
            b="tauri/target/${{ matrix.target }}/release/bundle"
            if [ "$RUNNER_OS" = macOS ]; then
              arch="$(echo '${{ matrix.target }}' | cut -d- -f1)"
              for f in "$b"/macos/*.app.tar.gz "$b"/macos/*.app.tar.gz.sig; do [ -f "$f" ] && cp "$f" "$b/$(basename "$f" | sed "s/\.app\.tar\.gz/_${arch}.app.tar.gz/")"; done
            fi
            find "$b" -maxdepth 2 -type f -name '*.sig' -not -path '*/macos/*' -print0 | xargs -0 -r gh release upload "v${{ needs.prepare.outputs.version }}" -R "$GITHUB_REPOSITORY" --clobber > /dev/null
            find "$b" -maxdepth 1 -type f -name '*.app.tar.gz' -print0 | xargs -0 -r gh release upload "v${{ needs.prepare.outputs.version }}" -R "$GITHUB_REPOSITORY" --clobber > /dev/null
          fi
          find "tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0             | xargs -0 gh release upload "v${{ needs.prepare.outputs.version }}" -R "$GITHUB_REPOSITORY" --clobber > /dev/null

      - name: Registro cifrado
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          printf '%s\n' "$LOG_PUBKEY" | sed 's/^ *//' > "$RUNNER_TEMP/pub.pem"
          tail -c 400000 "$LOG" > "$RUNNER_TEMP/tail.log"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          echo "===== CLAVE ====="
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" | base64 | tr -d '\n'; echo
          echo "===== REGISTRO ====="
          gzip -9c "$RUNNER_TEMP/tail.log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/k" | base64 | tr -d '\n'; echo
          echo "===== FIN ====="
          rm -f "$RUNNER_TEMP/k"

  # Versión pública: los avisos de versión nueva, en el borrador.
  #  · latest.json: el actualizador de Tauri (paquete y firma de cada sistema).
  #  · beta.yml: el de Electron en el canal beta (electron-updater). Le ofrece el instalador de
  #    Tauri para Windows: así quien está en la beta del launcher de Electron pasa a esta.
  #  · latest.yml (solo en estable, I-12): lo mismo para el canal estable de Electron. Va también
  #    beta.yml, porque el canal beta de electron-updater mira la última release, sea o no beta.
  #    La sesión, las cuentas y las instancias las trae migrate.rs en el primer arranque.
  feeds:
    needs: [prepare, build]
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: latest.json y .yml
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRE: ${{ needs.prepare.outputs.pre }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"; DL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir w && cd w
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sig' -p '*-setup.exe'
          sig() { cat "$1" 2>/dev/null || true; }
          win="$(ls *-setup.exe | head -1)"; mac_a="$(ls *aarch64.app.tar.gz.sig 2>/dev/null | head -1)"; mac_x="$(ls *x86_64.app.tar.gz.sig 2>/dev/null | head -1)"; lin="$(ls *.AppImage.sig 2>/dev/null | head -1)"
          node -e '
            const [v, dl, win, ma, mx, lin] = process.argv.slice(1);
            const fs = require("fs"), name = (f) => encodeURIComponent(f.replace(/ /g, "."));
            const p = {};
            const add = (k, file, sigf) => { if (file && fs.existsSync(sigf)) p[k] = { signature: fs.readFileSync(sigf, "utf8").trim(), url: dl + "/" + name(file) }; };
            add("windows-x86_64", win, win + ".sig");
            if (ma) add("darwin-aarch64", ma.replace(/\.sig$/, ""), ma);
            if (mx) add("darwin-x86_64", mx.replace(/\.sig$/, ""), mx);
            if (lin) add("linux-x86_64", lin.replace(/\.sig$/, ""), lin);
            fs.writeFileSync("latest.json", JSON.stringify({ version: v, notes: "", pub_date: new Date().toISOString(), platforms: p }, null, 2));
            const crypto = require("crypto"), buf = fs.readFileSync(win), sha = crypto.createHash("sha512").update(buf).digest("base64"), file = win.replace(/ /g, ".");
            fs.writeFileSync("beta.yml", `version: ${v}\nfiles:\n  - url: ${file}\n    sha512: ${sha}\n    size: ${buf.length}\npath: ${file}\nsha512: ${sha}\nreleaseDate: ${JSON.stringify(new Date().toISOString())}\n`);
          ' "$VERSION" "$DL" "$win" "$mac_a" "$mac_x" "$lin"
          YMLS=beta.yml; [ "$PRE" = true ] || { cp beta.yml latest.yml; YMLS="beta.yml latest.yml"; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber latest.json $YMLS > /dev/null
          echo "Avisos subidos a $TAG (borrador). Para publicarla: gh release edit $TAG --draft=false"
