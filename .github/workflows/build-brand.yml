# El launcher propio de un studio (plan Ultra). Mismas reglas que build.yml:
# registros públicos sin código ni configuración, sin artifacts ni cachés, y
# solo `workflow_dispatch`.
#
# Lo lanza el backend (POST /webhost/brands/:id/build) con BRAND_CODE_REPO
# apuntando a este repo. Lee la marca del backend con BRAND_BUILD_KEY, crea su
# repo público de releases si no existe (EventsTeamMC/launcher-<id>), compila
# las plataformas pedidas con `build.js --brand` y avisa al backend.
#
# Tauri (2.x): si el código de `ref` lleva tauri/, se compila el de Tauri con tauri/brand.mjs, firmado
# para su actualizador (latest.json), y con beta.yml/latest.yml para que el de Electron de la marca
# pase solo a este (como Events Client). Si no, el de Electron de siempre.
#
# El canal sale de la versión de `ref`, como en build.yml: X.Y.Z → release y
# latest*.yml; X.Y.Z-beta.N → prerelease y beta*.yml, que solo leen los
# jugadores con el canal beta. El backend elige `ref` (la última estable o la
# última beta de Events Client) según el canal que pida el admin.
#
# Secretos: SOURCE_TOKEN (solo «Contents: read» de events-client), BRANDS_TOKEN
# (crear launcher-<id> y publicar en él) y BRAND_BUILD_KEY (el mismo de la VPS).
# brand.json se pide en cada job y nunca se sube: en un repo público un artifact
# lo puede descargar cualquiera.
name: Launcher de marca
run-name: Marca ${{ inputs.brand }}${{ inputs.dry_run && ' (prueba)' || '' }}

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Id de la marca'
        required: true
      platforms:
        description: 'windows,macos,linux'
        default: 'windows,macos,linux'
      ref:
        description: 'Tag o commit de events-client'
        default: 'main'
      dry_run:
        description: 'Prueba: compila y no publica ni avisa al backend'
        type: boolean
        default: false

concurrency:
  group: brand-${{ inputs.brand }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  API: https://api.eventsmc.xyz/api
  BRAND: ${{ inputs.brand }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      repo: ${{ steps.release.outputs.repo }}
      old: ${{ steps.release.outputs.old }}
      new: ${{ steps.release.outputs.new }}
      pre: ${{ steps.release.outputs.pre }}
      tauri: ${{ steps.src.outputs.tauri }}
      version: ${{ steps.src.outputs.version }}
    steps:
      - name: Ejecuciones anteriores fuera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BRAND" =~ ^[a-z][a-z0-9-]{2,31}$ ]] || { echo "::error::Id de marca no válido"; exit 1; }
          gh run list -R "$GITHUB_REPOSITORY" --status completed --limit 100 --json databaseId -q '.[].databaseId' \
            | while read -r id; do gh run delete "$id" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; done

      - name: Código
        id: src
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref no válido"; exit 1; }
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$REF"
          git -C src checkout -q FETCH_HEAD
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f src/tauri/src-tauri/tauri.conf.json ]; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./src/tauri/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./src/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Marca
        env:
          KEY: ${{ secrets.BRAND_BUILD_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "x-brand-key: $KEY" "$API/brands/$BRAND/build-manifest" | jq '.data' > brand.json
          jq -e '.id and .build.releasesRepo and .build.icon' brand.json > /dev/null

      - name: Estado
        if: ${{ !inputs.dry_run }}
        env:
          KEY: ${{ secrets.BRAND_BUILD_KEY }}
        run: |
          curl -fsS -X POST -H "x-brand-key: $KEY" -H 'Content-Type: application/json' \
            -d "{\"runId\":\"$GITHUB_RUN_ID\",\"status\":\"running\"}" "$API/brands/$BRAND/build-status" > /dev/null

      - name: Repo de releases (se crea si no existe)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.BRANDS_TOKEN }}
        run: |
          set -euo pipefail
          REPO=$(jq -r .build.releasesRepo brand.json); NAME=${REPO#*/}
          # auto_init: un repo vacío no admite ni tags ni releases.
          gh api "repos/$REPO" > /dev/null 2>&1 || gh api -X POST orgs/EventsTeamMC/repos \
            -f name="$NAME" -F private=false -F auto_init=true \
            -F has_issues=false -F has_wiki=false -F has_projects=false \
            -f description="Instaladores de $(jq -r .build.productName brand.json)" > /dev/null

      - name: Release en borrador
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.BRANDS_TOKEN }}
        run: |
          set -euo pipefail
          REPO=$(jq -r .build.releasesRepo brand.json)
          VERSION="${{ steps.src.outputs.version }}"
          PRE=false
          [[ "$VERSION" == *-* ]] && PRE=true
          # Borradores de esta versión que dejó una ejecución que no llegó a `report`.
          gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id" \
            | while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id"; done
          # Recompilar la misma versión: la release publicada sigue hasta que `report` publica la nueva completa.
          OLD=""
          if J=$(gh api "repos/$REPO/releases/tags/v$VERSION" 2> /dev/null); then OLD=$(jq -r .id <<< "$J"); fi
          # Se crea aquí, una vez y en borrador: los jobs de cada plataforma solo suben a ella (antes competían, 422).
          NEW=$(gh api -X POST "repos/$REPO/releases" -f tag_name="v$VERSION" -f name="$VERSION" -f body="" -F draft=true -F prerelease=$PRE --jq .id)
          { echo "repo=$REPO"; echo "old=$OLD"; echo "new=$NEW"; echo "pre=$PRE"; } >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          P: ${{ inputs.platforms }}
          TAURI: ${{ steps.src.outputs.tauri }}
        run: |
          set -euo pipefail
          OS=()
          if [ "$TAURI" = true ]; then
            [[ "$P" == *windows* ]] && OS+=('{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}')
            [[ "$P" == *macos* ]] && OS+=('{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"}' '{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}')
            [[ "$P" == *linux* ]] && OS+=('{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"}')
          else
            [[ "$P" == *windows* ]] && OS+=('{"os":"windows-latest"}')
            [[ "$P" == *macos* ]] && OS+=('{"os":"macos-latest"}')
            [[ "$P" == *linux* ]] && OS+=('{"os":"ubuntu-latest"}')
          fi
          [ ${#OS[@]} -gt 0 ] || { echo "::error::Sin plataformas"; exit 1; }
          echo "matrix={\"include\":[$(IFS=,; echo "${OS[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Código
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q src
          git -C src -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$SOURCE_TOKEN"; }; f' \
            fetch -q --depth 1 https://github.com/EventsTeamMC/events-client.git "$SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Marca
        env:
          KEY: ${{ secrets.BRAND_BUILD_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -H "x-brand-key: $KEY" "$API/brands/$BRAND/build-manifest" \
            | node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(0, "utf8")).data))' > brand.json

      - name: Dependencias
        working-directory: src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ needs.prepare.outputs.tauri == 'true' && '1' || '' }}
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm.log" 2>&1 \
            || { echo "::error::npm ci ha fallado (el registro no se publica: reprodúcelo en local)"; exit 1; }

      - name: rpmbuild
        if: runner.os == 'Linux' && needs.prepare.outputs.tauri != 'true'
        run: sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq rpm > /dev/null

      - name: Compilar
        if: needs.prepare.outputs.tauri != 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ !inputs.dry_run && secrets.BRANDS_TOKEN || '' }}
          DRY: ${{ inputs.dry_run }}
        run: |
          V=$(node -p "require('./package.json').version"); CH=""
          [[ "$V" =~ -(beta|alpha|rc)\.?[0-9]*$ ]] && CH=--channel=beta
          [[ "$V" =~ -private\.?[0-9]*$ ]] && CH=--channel=private
          [ "$DRY" = true ] && unset CI GITHUB_ACTIONS
          node build.js --obf=true --build=platform --brand=../brand.json $CH > "$RUNNER_TEMP/build.log" 2>&1 \
            || { echo "::error::La compilación ha fallado (el registro no se publica: reprodúcelo en local)"; exit 1; }
          ls dist | grep -E '\.(exe|msi|dmg|zip|AppImage|deb|rpm|tar\.gz)$' || true

      # ---- Tauri ----
      - name: Marca en Tauri (nombre, iconos, EC_BRAND_*)
        if: needs.prepare.outputs.tauri == 'true'
        working-directory: src
        run: node tauri/brand.mjs ../brand.json > "$RUNNER_TEMP/brand.log" 2>&1 || { echo "::error::No se pudo preparar la marca"; exit 1; }

      - name: Sistema (Tauri)
        if: needs.prepare.outputs.tauri == 'true'
        run: |
          {
            rustup target add ${{ matrix.target }}
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            fi
          } > "$RUNNER_TEMP/sys.log" 2>&1 || { echo "::error::No se pudo preparar el sistema"; exit 1; }

      - name: Compilar (Tauri)
        if: needs.prepare.outputs.tauri == 'true'
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ !inputs.dry_run && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ !inputs.dry_run && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          EC_VERSION: ${{ needs.prepare.outputs.version }}
          UPD: ${{ !inputs.dry_run && 'true' || 'false' }}
        run: |
          ( (cd tauri/ui && npm ci --no-audit --no-fund && node build.mjs) \
            && cd tauri/src-tauri \
            && npx --yes @tauri-apps/cli@2.9.4 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
                 --config "{\"version\":\"$EC_VERSION\",\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"createUpdaterArtifacts\":$UPD}}" \
          ) > "$RUNNER_TEMP/build.log" 2>&1 || { echo "::error::La compilación ha fallado (el registro no se publica: reprodúcelo en local)"; exit 1; }
          find "tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec basename {} \;

      - name: Subir (Tauri)
        if: needs.prepare.outputs.tauri == 'true' && !inputs.dry_run
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.BRANDS_TOKEN }}
          REPO: ${{ needs.prepare.outputs.repo }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          b="tauri/target/${{ matrix.target }}/release/bundle"
          # macOS: el .app.tar.gz se llama igual en las dos arquitecturas; se le pone la suya.
          if [ "$RUNNER_OS" = macOS ]; then
            arch="$(echo '${{ matrix.target }}' | cut -d- -f1)"
            for f in "$b"/macos/*.app.tar.gz "$b"/macos/*.app.tar.gz.sig; do [ -f "$f" ] && cp "$f" "$b/$(basename "$f" | sed "s/\.app\.tar\.gz/_${arch}.app.tar.gz/")"; done
          fi
          find "$b" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o -name '*.app.tar.gz' \) -not -path '*/macos/*' -print0 \
            | xargs -0 gh release upload "$TAG" -R "$REPO" --clobber > /dev/null

  # Tauri: los avisos de versión nueva en la release de la marca.
  #  · latest.json: el actualizador de Tauri.
  #  · beta.yml (o latest.yml en estable): el de Electron de la marca, que así pasa a este (Windows).
  feeds:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.tauri == 'true' && !inputs.dry_run && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BRANDS_TOKEN }}
      REPO: ${{ needs.prepare.outputs.repo }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRE: ${{ needs.prepare.outputs.pre }}
    steps:
      - name: latest.json y .yml
        run: |
          set -euo pipefail
          TAG="v${VERSION}"; DL="https://github.com/$REPO/releases/download/$TAG"
          mkdir w && cd w
          gh release download "$TAG" -R "$REPO" -p '*.sig' -p '*-setup.exe'
          win="$(ls *-setup.exe 2>/dev/null | head -1 || true)"; mac_a="$(ls *aarch64.app.tar.gz.sig 2>/dev/null | head -1 || true)"; mac_x="$(ls *x86_64.app.tar.gz.sig 2>/dev/null | head -1 || true)"; lin="$(ls *.AppImage.sig 2>/dev/null | head -1 || true)"
          YML=latest.yml; [ "$PRE" = true ] && YML=beta.yml
          node -e '
            const [v, dl, win, ma, mx, lin, yml] = process.argv.slice(1);
            const fs = require("fs"), name = (f) => encodeURIComponent(f.replace(/ /g, "."));
            const p = {};
            const add = (k, file, sigf) => { if (file && fs.existsSync(sigf)) p[k] = { signature: fs.readFileSync(sigf, "utf8").trim(), url: dl + "/" + name(file) }; };
            add("windows-x86_64", win, win + ".sig");
            if (ma) add("darwin-aarch64", ma.replace(/\.sig$/, ""), ma);
            if (mx) add("darwin-x86_64", mx.replace(/\.sig$/, ""), mx);
            if (lin) add("linux-x86_64", lin.replace(/\.sig$/, ""), lin);
            fs.writeFileSync("latest.json", JSON.stringify({ version: v, notes: "", pub_date: new Date().toISOString(), platforms: p }, null, 2));
            if (win) {
              const crypto = require("crypto"), buf = fs.readFileSync(win), sha = crypto.createHash("sha512").update(buf).digest("base64"), file = win.replace(/ /g, ".");
              fs.writeFileSync(yml, `version: ${v}\nfiles:\n  - url: ${file}\n    sha512: ${sha}\n    size: ${buf.length}\npath: ${file}\nsha512: ${sha}\nreleaseDate: ${JSON.stringify(new Date().toISOString())}\n`);
            }
          ' "$VERSION" "$DL" "$win" "$mac_a" "$mac_x" "$lin" "$YML"
          gh release upload "$TAG" -R "$REPO" --clobber latest.json $( [ -f "$YML" ] && echo "$YML" ) > /dev/null

  report:
    needs: [prepare, build, feeds]
    if: ${{ always() && !inputs.dry_run && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BRANDS_TOKEN }}
      KEY: ${{ secrets.BRAND_BUILD_KEY }}
      REPO: ${{ needs.prepare.outputs.repo }}
      OLD: ${{ needs.prepare.outputs.old }}
      NEW: ${{ needs.prepare.outputs.new }}
      PRE: ${{ needs.prepare.outputs.pre }}
    steps:
      - name: Publicar (solo con todas las plataformas)
        id: publish
        if: needs.build.result == 'success' && (needs.prepare.outputs.tauri != 'true' || needs.feeds.result == 'success')
        run: |
          set -euo pipefail
          # Una beta sale como prerelease y no pasa a «latest»: los jugadores en estable no la ven.
          LATEST=true; [ "$PRE" = true ] && LATEST=false
          publish() { gh api -X PATCH "repos/$REPO/releases/$NEW" -F draft=false -f make_latest=$LATEST > /dev/null; }
          # La release anterior de esta versión se va cuando la nueva ya está fuera;
          # si GitHub no publica dos con el mismo tag, se va justo antes.
          if publish; then
            [ -z "$OLD" ] || gh api -X DELETE "repos/$REPO/releases/$OLD"
          else
            [ -n "$OLD" ] || exit 1
            gh api -X DELETE "repos/$REPO/releases/$OLD"
            publish
          fi
      - name: Borrador fuera (algo falló; la release anterior sigue)
        if: always() && steps.publish.outcome != 'success'
        run: gh api -X DELETE "repos/$REPO/releases/$NEW" || true
      - name: Estado final
        if: always()
        env:
          STATUS: ${{ steps.publish.outcome == 'success' && 'ok' || 'failed' }}
        run: |
          curl -fsS -X POST -H "x-brand-key: $KEY" -H 'Content-Type: application/json' \
            -d "{\"runId\":\"$GITHUB_RUN_ID\",\"status\":\"$STATUS\"}" "$API/brands/$BRAND/build-status" > /dev/null
      # Las 2 últimas estables, y la beta más nueva si va por delante de la última estable.
      - name: Limpieza
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          mapfile -t old < <(gh release list -R "$REPO" --limit 100 --json tagName,publishedAt,isDraft,isPrerelease --jq '
            map(select(.isDraft | not)) | sort_by(.publishedAt) | reverse
            | (map(select(.isPrerelease | not)) | .[0:2]) as $s
            | (map(select(.isPrerelease)) | .[0:1] | map(select(($s | length) == 0 or .publishedAt > $s[0].publishedAt))) as $b
            | ($s + $b | map(.tagName)) as $keep
            | .[] | select(.tagName as $t | $keep | index($t) | not) | .tagName')
          for tag in "${old[@]}"; do gh release delete "$tag" -R "$REPO" --yes --cleanup-tag > /dev/null || true; done
